<title>DSR PS2 Tech Debt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Cinzel:wght@600&display=swap">
<style>
/* Layout: a ledger. Summary strip (severity + per-area counts), filter bar, then one row per debt item; resolved log below. */
:root {
  --bg: #f3f2ee; --surface: #fbfaf7; --fg: #1f1d1a; --muted: #6b665d; --line: #dcd8cf;
  --accent: #9a5b1e;           /* bonfire ember */
  --sev-h: #b3261e; --sev-m: #b07a12; --sev-l: #5b7a5a; --ok: #3f6f52;
  --chip: #ebe8e1;
  --display: "Cinzel", Georgia, serif;
  --body: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15140f; --surface: #1d1b16; --fg: #e9e5dc; --muted: #9c968a; --line: #34312a;
  --accent: #e0954a; --sev-h: #ef6b5f; --sev-m: #e2b04a; --sev-l: #8fb08c; --ok: #7fb894; --chip: #2a2720; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #15140f; --surface: #1d1b16; --fg: #e9e5dc; --muted: #9c968a; --line: #34312a;
  --accent: #e0954a; --sev-h: #ef6b5f; --sev-m: #e2b04a; --sev-l: #8fb08c; --ok: #7fb894; --chip: #2a2720; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 22px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; }
h1 { font-family: var(--display); font-weight: 600; font-size: clamp(22px, 4vw, 30px); letter-spacing: .04em; margin: 0; text-wrap: balance; }
h1 span { color: var(--accent); }
.meta { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
h2 { font-family: var(--display); font-weight: 600; font-size: 17px; letter-spacing: .05em; margin: 8px 0 0; }
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; display: grid; gap: 2px; }
.stat b { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat small { color: var(--muted); text-transform: uppercase; letter-spacing: .07em; font-size: 11px; }
.stat.h b { color: var(--sev-h); } .stat.m b { color: var(--sev-m); } .stat.l b { color: var(--sev-l); } .stat.ok b { color: var(--ok); }
.areas { display: flex; flex-wrap: wrap; gap: 6px; }
.areas button, .sevs button { font: inherit; font-size: 12.5px; border: 1px solid var(--line); background: var(--chip); color: var(--fg);
  border-radius: 999px; padding: 3px 10px; cursor: pointer; font-variant-numeric: tabular-nums; }
.areas button[aria-pressed="true"], .sevs button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.sevs { display: flex; gap: 6px; }
#q { flex: 1 1 220px; min-width: 0; font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); }
.count { color: var(--muted); font-size: 13px; }
.list { display: grid; gap: 8px; }
.item { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--sev-l); border-radius: 6px;
  padding: 12px 14px; display: grid; gap: 8px; min-width: 0; }
.item.H { border-left-color: var(--sev-h); } .item.M { border-left-color: var(--sev-m); }
.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.id { font-family: var(--mono); font-weight: 500; font-size: 13px; color: var(--accent); }
.area { font-weight: 600; }
.sev { font-family: var(--mono); font-size: 11px; font-weight: 500; padding: 1px 7px; border-radius: 4px; color: var(--bg); background: var(--sev-l); margin-left: auto; }
.sev.H { background: var(--sev-h); } .sev.M { background: var(--sev-m); }
.cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.cols div { min-width: 0; overflow-wrap: anywhere; }
.cols h3 { margin: 0 0 2px; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.cols p { margin: 0; font-size: 13px; }
code { font-family: var(--mono); font-size: 12px; background: var(--chip); padding: 0 4px; border-radius: 3px; }
.empty { color: var(--muted); padding: 18px; text-align: center; border: 1px dashed var(--line); border-radius: 6px; }
.resolved { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
tr:last-child td { border-bottom: 0; }
td.rid { font-family: var(--mono); color: var(--ok); white-space: nowrap; }
td.rdate { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--muted); }
@media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
</style>

<div class="wrap">
  <header>
    <h1>DSR <span>→</span> PS2 technical debt</h1>
    <div class="meta" id="meta"></div>
  </header>
  <p class="meta" style="margin:-12px 0 0">Every place the PS2 port does not yet match Dark Souls Remastered. H = visible in normal play or wrong gameplay numbers, M = noticeable on inspection, L = cosmetic or matters later.</p>
  <section class="summary" id="summary"></section>
  <div class="areas" id="areas" aria-label="Filter by area"></div>
  <div class="filters">
    <div class="sevs" id="sevs" aria-label="Filter by severity"></div>
    <input id="q" type="search" placeholder="Search ID, area, text, exe address…" aria-label="Search">
    <span class="count" id="count"></span>
  </div>
  <section class="list" id="list"></section>
  <h2>Resolved</h2>
  <div class="resolved"><table><thead><tr><th>ID</th><th>Date</th><th>What fixed it</th></tr></thead><tbody id="resolved"></tbody></table></div>
</div>

<script>
const DATA = /*DATA*/null;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
const prefix = id => id.replace(/-\d+$/, '');
const order = {H: 0, M: 1, L: 2};
const st = {area: null, sev: null, q: ''};
try { const s = JSON.parse(localStorage.getItem('td-filters') || '{}'); Object.assign(st, s); } catch (e) {}
const save = () => { try { localStorage.setItem('td-filters', JSON.stringify(st)); } catch (e) {} };

document.getElementById('meta').textContent = `Updated ${DATA.updated} · ${DATA.open.length} open · ${DATA.resolved.length} resolved`;
const sevCount = s => DATA.open.filter(r => r.sev === s).length;
document.getElementById('summary').innerHTML =
  `<div class="stat h"><b>${sevCount('H')}</b><small>High</small></div>` +
  `<div class="stat m"><b>${sevCount('M')}</b><small>Medium</small></div>` +
  `<div class="stat l"><b>${sevCount('L')}</b><small>Low</small></div>` +
  `<div class="stat ok"><b>${DATA.resolved.length}</b><small>Resolved</small></div>`;

const areas = {};
DATA.open.forEach(r => { const p = prefix(r.id); areas[p] = areas[p] || {n: 0, h: 0}; areas[p].n++; if (r.sev === 'H') areas[p].h++; });
const areasEl = document.getElementById('areas');
const sevsEl = document.getElementById('sevs');
const q = document.getElementById('q');
q.value = st.q || '';

function chips() {
  areasEl.innerHTML = `<button data-a="" aria-pressed="${!st.area}">All areas</button>` +
    Object.keys(areas).sort().map(a => `<button data-a="${esc(a)}" aria-pressed="${st.area === a}">${esc(a)} ${areas[a].n}${areas[a].h ? ' · ' + areas[a].h + 'H' : ''}</button>`).join('');
  sevsEl.innerHTML = ['', 'H', 'M', 'L'].map(s => `<button data-s="${s}" aria-pressed="${(st.sev || '') === s}">${s || 'All'}</button>`).join('');
}
function render() {
  const t = st.q.trim().toLowerCase();
  const rows = DATA.open
    .filter(r => (!st.area || prefix(r.id) === st.area) && (!st.sev || r.sev === st.sev))
    .filter(r => !t || Object.values(r).join(' ').toLowerCase().includes(t))
    .sort((a, b) => (order[a.sev] ?? 3) - (order[b.sev] ?? 3) || a.id.localeCompare(b.id, undefined, {numeric: true}));
  document.getElementById('count').textContent = `${rows.length} shown`;
  document.getElementById('list').innerHTML = rows.length ? rows.map(r => `
    <article class="item ${esc(r.sev)}">
      <div class="top"><span class="id">${esc(r.id)}</span><span class="area">${md(r.area)}</span><span class="sev ${esc(r.sev)}">${esc(r.sev)}</span></div>
      <div class="cols">
        <div><h3>Original DSR</h3><p>${md(r.dsr)}</p></div>
        <div><h3>Port today</h3><p>${md(r.port)}</p></div>
        <div><h3>Source / fix path</h3><p>${md(r.fix)}</p></div>
      </div>
    </article>`).join('') : '<div class="empty">No open items match these filters.</div>';
  const rt = DATA.resolved.filter(r => (!st.area || prefix(r.id) === st.area) && (!t || Object.values(r).join(' ').toLowerCase().includes(t)));
  document.getElementById('resolved').innerHTML = rt.slice().reverse().map(r =>
    `<tr><td class="rid">${esc(r.id)}</td><td class="rdate">${esc(r.date)}</td><td>${md(r.fix)}</td></tr>`).join('') ||
    '<tr><td colspan="3" class="rdate">Nothing resolved in this filter yet.</td></tr>';
}
areasEl.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; st.area = b.dataset.a || null; save(); chips(); render(); });
sevsEl.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; st.sev = b.dataset.s || null; save(); chips(); render(); });
q.addEventListener('input', () => { st.q = q.value; save(); render(); });
chips(); render();
</script>
